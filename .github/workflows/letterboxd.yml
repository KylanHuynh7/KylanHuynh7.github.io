name: refresh letterboxd diary

on:
  schedule:
    - cron: '17 13 * * *'   # daily, ~6am PT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/letterboxd.mjs
      - name: commit if changed
        run: |
          if git diff --quiet -- letterboxd.json; then echo "no change"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add letterboxd.json
          git commit -m "letterboxd: refresh diary"
          git push
